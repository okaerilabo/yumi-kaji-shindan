<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生年月日でわかる家事タイプ診断｜ゆみ｜料理から叶える家事改善</title>
<!-- HPと同じ書体（Noto Sans JP＝本文、Shippori Mincho＝見出しの明朝） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 色はHP（yumi-hp.pages.dev）と同じ。白ベース＋くすみピンク／ローズ */
  :root{
    --paper:#ffffff;
    --paper-2:#fdf9f8;
    --ink:#3a2828;
    --ink-soft:#5a4538;
    --ink-faint:#8a7569;
    --accent-base:#9e5a60;
    --accent-base-2:#8a4c52;
    --pink:#f4e6e2;
    --pink-mid:#ddb8b6;
    --line:#e8d8d2;

    /* 4タイプとも同じローズ。違いは漢字と文章で出す（HPと色をそろえるため） */
    --fire-accent:#9e5a60;  --fire-tint:#f4e6e2;
    --earth-accent:#9e5a60; --earth-tint:#f4e6e2;
    --air-accent:#9e5a60;   --air-tint:#f4e6e2;
    --water-accent:#9e5a60; --water-tint:#f4e6e2;

    --accent: var(--accent-base);
    --card-bg: var(--paper-2);
    --shadow: none;
  }


  *{ box-sizing:border-box; }

  .shindan-app{
    background:var(--paper);
    color:var(--ink-soft);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;
    letter-spacing:.05em;
    line-height:1.95;
    min-height:100%;
    padding:0 0 64px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{ max-width:420px; margin:0 auto; padding:0 22px; }

  .hero{
    padding:56px 22px 24px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  #inputSection{ padding-top:20px; }
  .eyebrow{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-faint);
    margin:0 0 14px;
    white-space:nowrap;
  }
  /* タイトル：HPと同じ明朝体。左に線画アイコンを並べる */
  .hero h1{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:500;
    font-size:clamp(23px,5.6vw,30px);
    line-height:1.75;
    letter-spacing:.1em;
    margin:0 0 20px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--accent-base);
  }
  .title-icon{
    width:65px;
    height:auto;
    flex:none;
    display:block;
    mix-blend-mode:multiply; /* 画像の白い背景を、ページの背景になじませる */
  }
  /* スマホは横幅が狭いので、アイコンだけ少し小さくする（タイトルと窮屈にならないように） */
  @media (max-width:430px){
    .title-icon{ width:56px; }
    .hero h1{ gap:8px; }
  }
  .hero p{
    max-width:32ch;
    margin:0 auto 30px;
    color:var(--ink-soft);
    font-size:15px;
  }
  section{ padding:40px 22px; }
  .step-title{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:19px;
    font-weight:500;
    letter-spacing:.14em;
    margin:0 0 26px;
    color:var(--ink);
    text-align:center;
  }
  /* 見出しの下：細いグレー線の上に、短いピンクの線（HPと同じ形） */
  .step-title::after{
    content:"";
    display:block;
    width:100%;
    height:4px;
    margin:18px auto 0;
    background:linear-gradient(var(--pink-mid),var(--pink-mid)) center top/44px 4px no-repeat,
               linear-gradient(var(--line),var(--line)) center bottom/100% 1px no-repeat;
  }

  .date-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px 30px;
  }
  .date-fields{
    display:grid;
    grid-template-columns:1.15fr .9fr .9fr;
    gap:10px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  select{
    width:100%;
    font-family:inherit;
    font-size:15px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 8px;
    appearance:none;
    -webkit-appearance:none;
  }
  select:focus-visible{ outline:3px solid var(--water-accent); outline-offset:2px; }

  /* ボタンはHPの「募集開始のお知らせを受け取る」と同じ形（ローズ色・カプセル） */
  .diagnose-btn{
    width:100%;
    margin-top:24px;
    background:var(--accent-base);
    color:#fff;
    border:none;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    letter-spacing:.1em;
    padding:15px;
    border-radius:99px;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  .diagnose-btn:hover{ opacity:.85; }
  .diagnose-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .diagnose-btn:focus-visible{ outline:3px solid var(--water-accent); outline-offset:3px; }
  .error-msg{
    font-size:13px;
    color:var(--fire-accent);
    margin-top:10px;
    min-height:1em;
  }

  .result{
    display:none;
  }
  .result.is-visible{ display:block; }

  .result-card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    padding:34px 24px 30px;
    opacity:0;
    transform:translateY(14px) scale(.98);
    animation:reveal .6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @media (prefers-reduced-motion:reduce){
    .result-card{ animation:none; opacity:1; transform:none; }
  }

  .emblem{ display:block; margin:0 auto 18px; }
  .emblem circle{ fill:none; stroke:var(--accent); stroke-width:2.5; }
  .emblem text{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:32px;
    fill:var(--accent);
    text-anchor:middle;
    dominant-baseline:central;
  }

  .zodiac-line{
    text-align:center;
    font-size:12px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    margin:0 0 6px;
  }
  .type-name{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    text-align:center;
    font-size:25px;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--accent);
    margin:0 0 6px;
    line-height:1.7;
    text-wrap:balance;
  }
  .type-kana{
    text-align:center;
    font-size:13px;
    color:var(--ink-faint);
    margin:0 0 24px;
  }

  .result-block{ margin:0 0 22px; }
  .result-block h3{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    margin:0 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .result-block h3::before{
    content:"";
    width:14px; height:1px;
    background:var(--accent);
    display:inline-block;
  }
  .result-block p{
    font-size:14.5px;
    color:var(--ink);
    margin:0;
  }
  .result-block p + p{ margin-top:10px; }

  .recipe-grid{
    display:flex;
    justify-content:center;
  }
  .recipe-grid .recipe-card{
    width:160px;
  }
  .recipe-card{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    width:100%;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-family:inherit;
  }
  .recipe-card img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
    display:block;
  }
  .recipe-card span{
    display:block;
    margin-top:6px;
    font-size:11px;
    line-height:1.4;
    color:var(--ink);
    text-align:center;
  }
  .recipe-hint{
    font-size:12px;
    color:var(--ink-faint);
    margin:10px 0 0;
  }

  .lightbox{
    display:none;
    position:absolute;
    left:0;
    right:0;
    background:rgba(58,40,40,0.88);
    z-index:100;
    padding:24px;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
  }
  .lightbox.is-visible{ display:flex; }
  .lightbox-inner{
    max-width:480px;
    width:100%;
  }
  .lightbox-inner img{
    width:100%;
    border-radius:14px;
    display:block;
  }
  .lightbox-caption{
    text-align:center;
    color:#fdf9f8;
    font-size:13px;
    margin:14px 0 0;
  }
  .lightbox-close{
    display:block;
    margin:16px auto 0;
    background:rgba(255,255,255,0.12);
    color:#fdf9f8;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:999px;
    padding:10px 26px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }

  .advice{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    padding-top:18px;
    border-top:1px solid var(--line);
  }

  .share-hint{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-faint);
    margin:18px 0 0;
  }

  .retry-btn{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--ink-faint);
    font-family:inherit;
    font-size:13px;
    text-decoration:underline;
    padding:16px 0 0;
    cursor:pointer;
  }

  footer.credit{
    text-align:center;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--ink-faint);
    padding:28px 22px 0;
  }
</style>
</head>

    var prevDay = daySelect.value;
    daySelect.innerHTML = "";
    var maxDay = daysInMonth(parseInt(yearSelect.value, 10), parseInt(monthSelect.value, 10) || 1);
    for (var d = 1; d <= maxDay; d++) {
      var opt = document.createElement("option");
      opt.value = d; opt.textContent = d + "日";
      daySelect.appendChild(opt);
    }
    if (prevDay && prevDay <= maxDay) daySelect.value = prevDay;
  }
  monthSelect.value = 6;
  populateDays();
  daySelect.value = 15;

  yearSelect.addEventListener("change", populateDays);
  monthSelect.addEventListener("change", populateDays);

  function zodiacOf(month, day){
    for (var i = 0; i < ZODIAC.length; i++){
      var e = ZODIAC[i].end;
      if (month < e[0] || (month === e[0] && day <= e[1])) return ZODIAC[i];
    }
    return ZODIAC[ZODIAC.length - 1];
  }
  function hiddenGroupOf(year){
    var idx = ((year % 4) + 4) % 4;
    return GROUPS[idx];
  }

  document.getElementById("diagnoseBtn").addEventListener("click", function(){
    var year = parseInt(yearSelect.value, 10);
    var month = parseInt(monthSelect.value, 10);
    var day = parseInt(daySelect.value, 10);

    if (!year || !month || !day) {
      errorMsg.textContent = "生年月日を選択してください。";
      return;
    }
    errorMsg.textContent = "";

    var zodiac = zodiacOf(month, day);
    var group = zodiac.element;
    var type = TYPES[group];
    var hiddenGroup = hiddenGroupOf(year);
    var hiddenType = TYPES[hiddenGroup];

    document.getElementById("emblemChar").textContent = type.kanji;
    document.getElementById("resultCard").setAttribute("data-element", group);
    document.getElementById("birthLine").textContent = year + "年" + month + "月" + day + "日生まれ";
    document.getElementById("typeName").textContent = type.name;
    document.getElementById("typeKana").textContent = zodiac.sign + "｜" + type.kanji + "のサイン";
    document.getElementById("typeDesc").textContent = type.desc;
    document.getElementById("tipText").textContent = type.tip;
    var recipeGrid = document.getElementById("recipeGrid");
    recipeGrid.innerHTML = "";
    type.recipes.forEach(function(recipe){
      var card = document.createElement("button");
      card.className = "recipe-card";
      card.type = "button";
      card.addEventListener("click", function(){
        openLightbox(recipe.img, recipe.name);
      });

      var img = document.createElement("img");
      img.src = recipe.img;
      img.alt = recipe.name;
      img.loading = "lazy";

      var caption = document.createElement("span");
      caption.textContent = recipe.name;

      card.appendChild(img);
      card.appendChild(caption);
      recipeGrid.appendChild(card);
    });
    document.getElementById("adviceLine").textContent = type.advice;

    if (hiddenGroup === group) {
      document.getElementById("hiddenDesc").textContent = "隠れタイプも同じ" + type.kanji + "。芯までブレない一貫タイプです。";
    } else {
      document.getElementById("hiddenDesc").textContent = hiddenType.name + "（" + hiddenType.kanji + "）の一面も持ち合わせています。" + hiddenType.hidden;
    }

    resultCard.classList.remove("is-visible");
    void resultCard.offsetWidth;
    resultSection.classList.add("is-visible");
    resultCard.style.animation = "none";
    void resultCard.offsetWidth;
    resultCard.style.animation = "";

    resultSection.scrollIntoView({behavior:"smooth", block:"start"});
  });

  document.getElementById("retryBtn").addEventListener("click", function(){
    resultSection.classList.remove("is-visible");
    inputSection.scrollIntoView({behavior:"smooth", block:"start"});
  });

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxCaption = document.getElementById("lightboxCaption");

  function openLightbox(src, caption){
    lightboxImg.src = src;
    lightboxImg.alt = caption;
    lightboxCaption.textContent = caption;
    lightbox.style.top = window.scrollY + "px";
    lightbox.style.height = window.innerHeight + "px";
    lightbox.classList.add("is-visible");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox(){
    lightbox.classList.remove("is-visible");
    lightboxImg.src = "";
    document.body.style.overflow = "";
  }
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function(e){
    if (e.target === lightbox) closeLightbox();
  });
})();
</script>
</body>
</html>
